<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Infinite Collage</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6e5e0;--dot:#c4c3bc;--panel:#fbfbf9;--ink:#1d1f24;--mute:#6b6f78;--line:#d3d2cb;--acc:#2a6b66;--accInk:#fff;--sel:#2a6b66;--hand:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--dot:#2c3039;--panel:#1f2229;--ink:#e8e9ec;--mute:#8d93a0;--line:#333843;--acc:#5fc4bb;--accInk:#0c1a19;--sel:#5fc4bb;--hand:#15171c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171c;--dot:#2c3039;--panel:#1f2229;--ink:#e8e9ec;--mute:#8d93a0;--line:#333843;--acc:#5fc4bb;--accInk:#0c1a19;--sel:#5fc4bb;--hand:#15171c;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.bar .sp{flex:1 1 20px}
.grp{display:flex;gap:6px;align-items:center}
.btn{font:inherit;font-weight:500;padding:7px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--mute)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.opt select,.opt input[type=number]{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)}
.opt input[type=number]{width:64px}
.opt input[type=range]{width:84px;accent-color:var(--acc)}
.info{color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.opt{display:flex;align-items:center;gap:5px;color:var(--mute);font-size:13px}
.opt input[type=color]{width:26px;height:26px;padding:0;border:1px solid var(--line);border-radius:4px;background:none}
#stage{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;color:var(--mute);pointer-events:none;padding:20px}
#empty b{font-size:18px;font-weight:600;color:var(--ink)}
#toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;max-width:90%;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
#stage.drop{outline:3px dashed var(--acc);outline-offset:-8px}
</style>
</head>
<body>
<div class="bar">
  <div class="grp">
    <button class="btn primary" id="add">Add images</button>
    <button class="btn" id="front" disabled>Bring front</button>
    <button class="btn" id="back" disabled>Send back</button>
    <button class="btn" id="del" disabled>Delete</button>
    <button class="btn" id="fit">Fit view</button>
  </div>
  <div class="sp"></div>
  <div class="grp">
    <span class="info" id="info">Nothing to export</span>
    <label class="opt">Format <select id="fmt"><option value="png">PNG (lossless)</option><option value="jpeg">JPEG</option><option value="webp">WebP</option></select></label>
    <label class="opt" id="qw" hidden>Quality <input type="range" id="q" min="10" max="100" value="85"><span id="qv">85</span></label>
    <label class="opt">Max MB <input type="number" id="tgt" min="0.1" step="0.5" placeholder="none"></label>
    <label class="opt"><input type="checkbox" id="tr" checked> Transparent</label>
    <label class="opt" id="bgw" hidden><input type="color" id="bg" value="#ffffff" aria-label="Background colour"></label>
    <button class="btn primary" id="exp" disabled>Export</button>
  </div>
</div>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="empty"><b>Drop images here</b><span>or use Add images. Paste works too.<br>Drag to move, drag corners to resize, drag empty space to pan, scroll to zoom.</span></div>
  <div id="toast"></div>
</div>
<input type="file" id="file" accept="image/*" multiple hidden>
<script>
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d'),stage=$('#stage');
let items=[],sel=null,view={x:0,y:0,k:1},dpr=1,W=0,H=0;
const MAXD=16384,MAXA=268435456;

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3500)}
function resize(){dpr=window.devicePixelRatio||1;const r=stage.getBoundingClientRect();W=r.width;H=r.height;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);draw()}
new ResizeObserver(resize).observe(stage);
const toWorld=(sx,sy)=>({x:(sx-view.x)/view.k,y:(sy-view.y)/view.k});
const corners=it=>[[it.x,it.y],[it.x+it.w,it.y],[it.x+it.w,it.y+it.h],[it.x,it.y+it.h]];

function draw(){
  const cs=getComputedStyle(document.documentElement),v=n=>cs.getPropertyValue(n).trim();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=v('--bg');ctx.fillRect(0,0,W,H);
  let g=40*view.k;while(g<18)g*=2;
  const ox=((view.x%g)+g)%g,oy=((view.y%g)+g)%g;
  ctx.fillStyle=v('--dot');
  for(let x=ox;x<W;x+=g)for(let y=oy;y<H;y+=g)ctx.fillRect(x-1,y-1,2,2);
  ctx.setTransform(dpr*view.k,0,0,dpr*view.k,dpr*view.x,dpr*view.y);
  ctx.imageSmoothingQuality='high';
  for(const it of items)ctx.drawImage(it.img,it.x,it.y,it.w,it.h);
  if(sel){
    ctx.lineWidth=2/view.k;ctx.strokeStyle=v('--sel');ctx.strokeRect(sel.x,sel.y,sel.w,sel.h);
    const s=10/view.k;ctx.fillStyle=v('--hand');
    for(const [cx,cy] of corners(sel)){ctx.fillRect(cx-s/2,cy-s/2,s,s);ctx.strokeRect(cx-s/2,cy-s/2,s,s)}
  }
}

function bbox(){
  if(!items.length)return null;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const i of items){x0=Math.min(x0,i.x);y0=Math.min(y0,i.y);x1=Math.max(x1,i.x+i.w);y1=Math.max(y1,i.y+i.h)}
  return{x:x0,y:y0,w:x1-x0,h:y1-y0};
}
// Export scale = the highest native-pixels-per-unit of any image, so nothing is ever downsampled.
function plan(){
  const b=bbox();if(!b)return null;
  let s=0;for(const it of items)s=Math.max(s,it.nw/it.w);
  const lim=Math.min(MAXD/b.w,MAXD/b.h,Math.sqrt(MAXA/(b.w*b.h)));
  let capped=false;if(s>lim){s=lim;capped=true}
  return{b,s,w:Math.max(1,Math.round(b.w*s)),h:Math.max(1,Math.round(b.h*s)),capped};
}
function update(){
  const p=plan();
  $('#info').textContent=p?`Export ${p.w.toLocaleString()} × ${p.h.toLocaleString()} px`+(p.capped?' (size limit)':''):'Nothing to export';
  $('#exp').disabled=!p;
  for(const id of['front','back','del'])$('#'+id).disabled=!sel;
  $('#empty').hidden=items.length>0;
}
function fit(){
  const b=bbox();if(!b||W<10)return;
  const m=50,k=Math.max(0.02,Math.min((W-m*2)/b.w,(H-m*2)/b.h,8));
  view.k=k;view.x=(W-b.w*k)/2-b.x*k;view.y=(H-b.h*k)/2-b.y*k;draw();
}

/* ---------- loading ---------- */
const load=f=>new Promise((res,rej)=>{const img=new Image();img.onload=()=>res(img);img.onerror=()=>rej(f.name||'image');img.src=URL.createObjectURL(f)});
async function addFiles(files){
  const list=[...files].filter(f=>f.type.startsWith('image/')||/\.(jfif|jpe?g|png|webp|gif|bmp|avif)$/i.test(f.name));
  if(!list.length){toast('No image files found.');return}
  let x=items.length?bbox().x+bbox().w:0;const y=items.length?bbox().y:0;
  let failed=[];
  for(const f of list){
    try{
      const img=await load(f);
      const nw=img.naturalWidth,nh=img.naturalHeight,h=400,w=h*nw/nh;
      const it={img,nw,nh,x,y,w,h};items.push(it);sel=it;x+=w;
    }catch(n){failed.push(n)}
  }
  if(failed.length)toast(`Couldn’t open: ${failed.join(', ')}`);
  fit();update();
}
$('#add').onclick=()=>$('#file').click();
$('#file').onchange=e=>{addFiles(e.target.files);e.target.value=''};
stage.addEventListener('dragover',e=>{e.preventDefault();stage.classList.add('drop')});
stage.addEventListener('dragleave',()=>stage.classList.remove('drop'));
stage.addEventListener('drop',e=>{e.preventDefault();stage.classList.remove('drop');addFiles(e.dataTransfer.files)});
addEventListener('paste',e=>{const fs=[...(e.clipboardData?.files||[])];if(fs.length)addFiles(fs)});

/* ---------- interaction ---------- */
const ptrs=new Map();let drag=null,pinch=null,space=false;
const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
function hitHandle(w){
  if(!sel)return -1;const r=14/view.k;
  const c=corners(sel);for(let i=0;i<4;i++)if(Math.abs(w.x-c[i][0])<r&&Math.abs(w.y-c[i][1])<r)return i;return -1;
}
function hit(w){for(let i=items.length-1;i>=0;i--){const it=items[i];if(w.x>=it.x&&w.x<=it.x+it.w&&w.y>=it.y&&w.y<=it.y+it.h)return it}return null}
function snapMove(it,nx,ny){
  const t=8/view.k;let bx=t,by=t,mx=0,my=0;
  for(const o of items){if(o===it)continue;
    for(const a of[nx,nx+it.w])for(const b of[o.x,o.x+o.w]){const d=b-a;if(Math.abs(d)<bx){bx=Math.abs(d);mx=d}}
    for(const a of[ny,ny+it.h])for(const b of[o.y,o.y+o.h]){const d=b-a;if(Math.abs(d)<by){by=Math.abs(d);my=d}}
  }
  return[nx+mx,ny+my];
}
function nearest(vals,v,t){let best=null,bd=t;for(const a of vals){const d=Math.abs(a-v);if(d<bd){bd=d;best=a}}return best}
function resizeTo(w){
  const d=drag,it=sel,right=d.hs===1||d.hs===2,bottom=d.hs===2||d.hs===3,ar=it.nh/it.nw,t=8/view.k;
  const ex=[],ey=[];for(const o of items)if(o!==it){ex.push(o.x,o.x+o.w);ey.push(o.y,o.y+o.h)}
  let nw=right?w.x-d.ax:d.ax-w.x;
  const sx=nearest(ex,w.x,t),sy=nearest(ey,w.y,t);
  if(sx!==null)nw=right?sx-d.ax:d.ax-sx;
  else if(sy!==null)nw=(bottom?sy-d.ay:d.ay-sy)/ar;
  nw=Math.max(16/view.k,nw);const nh=nw*ar;
  it.w=nw;it.h=nh;it.x=right?d.ax:d.ax-nw;it.y=bottom?d.ay:d.ay-nh;
}
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);const p=pos(e);ptrs.set(e.pointerId,p);
  if(ptrs.size===2){drag=null;startPinch();return}
  const w=toWorld(p.x,p.y);
  if(!space&&e.button===0){
    const hs=hitHandle(w);
    if(hs>=0){const c=corners(sel)[(hs+2)%4];drag={t:'resize',hs,ax:c[0],ay:c[1]};return}
    const it=hit(w);
    if(it){sel=it;drag={t:'move',dx:w.x-it.x,dy:w.y-it.y};draw();update();return}
    sel=null;update();
  }
  drag={t:'pan',sx:p.x,sy:p.y,vx:view.x,vy:view.y};draw();
});
cv.addEventListener('pointermove',e=>{
  const p=pos(e);
  if(!ptrs.has(e.pointerId)){
    const w=toWorld(p.x,p.y),hs=hitHandle(w);
    cv.style.cursor=space?'grab':hs>=0?(hs%2?'nesw-resize':'nwse-resize'):hit(w)?'move':'default';return;
  }
  ptrs.set(e.pointerId,p);
  if(ptrs.size===2){doPinch();return}
  if(!drag)return;
  const w=toWorld(p.x,p.y);
  if(drag.t==='pan'){view.x=drag.vx+p.x-drag.sx;view.y=drag.vy+p.y-drag.sy}
  else if(drag.t==='move'){[sel.x,sel.y]=snapMove(sel,w.x-drag.dx,w.y-drag.dy)}
  else resizeTo(w);
  draw();update();
});
const endPtr=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(!ptrs.size)drag=null};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
function startPinch(){const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,v:{...view}}}
function doPinch(){
  if(!pinch)return;const[a,b]=[...ptrs.values()];
  const d=Math.hypot(a.x-b.x,a.y-b.y),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
  const k=Math.min(64,Math.max(0.02,pinch.v.k*d/pinch.d));
  const wx=(pinch.cx-pinch.v.x)/pinch.v.k,wy=(pinch.cy-pinch.v.y)/pinch.v.k;
  view.k=k;view.x=cx-wx*k;view.y=cy-wy*k;draw();
}
function zoomAt(x,y,f){const k=Math.min(64,Math.max(0.02,view.k*f)),w=toWorld(x,y);view.k=k;view.x=x-w.x*k;view.y=y-w.y*k;draw()}
cv.addEventListener('wheel',e=>{
  e.preventDefault();const p=pos(e),dy=e.deltaY*(e.deltaMode===1?33:1);
  zoomAt(p.x,p.y,Math.exp(-dy*(e.ctrlKey?0.01:0.0015)));
},{passive:false});
addEventListener('keydown',e=>{
  if(e.code==='Space'){space=true;cv.style.cursor='grab';if(e.target===document.body)e.preventDefault()}
  if((e.key==='Delete'||e.key==='Backspace')&&sel)delSel();
});
addEventListener('keyup',e=>{if(e.code==='Space'){space=false;cv.style.cursor='default'}});

/* ---------- toolbar ---------- */
function delSel(){if(!sel)return;items=items.filter(i=>i!==sel);sel=null;draw();update()}
$('#del').onclick=delSel;
$('#front').onclick=()=>{if(!sel)return;items=items.filter(i=>i!==sel);items.push(sel);draw()};
$('#back').onclick=()=>{if(!sel)return;items=items.filter(i=>i!==sel);items.unshift(sel);draw()};
$('#fit').onclick=fit;
$('#tr').onchange=e=>{$('#bgw').hidden=e.target.checked};

/* ---------- export ---------- */
$('#fmt').onchange=()=>{$('#qw').hidden=$('#fmt').value==='png'};
$('#q').oninput=()=>{$('#qv').textContent=$('#q').value};
function render(p,s){
  const w=Math.max(1,Math.round(p.b.w*s)),h=Math.max(1,Math.round(p.b.h*s));
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');if(!g)return null;
  const tr=$('#tr').checked;
  if($('#fmt').value==='jpeg'||!tr){g.fillStyle=tr?'#ffffff':$('#bg').value;g.fillRect(0,0,w,h)}
  g.imageSmoothingQuality='high';
  for(const it of items){
    const x0=Math.round((it.x-p.b.x)*s),y0=Math.round((it.y-p.b.y)*s);
    const x1=Math.round((it.x+it.w-p.b.x)*s),y1=Math.round((it.y+it.h-p.b.y)*s);
    g.drawImage(it.img,x0,y0,Math.max(1,x1-x0),Math.max(1,y1-y0));
  }
  return c;
}
const enc=(c,t,q)=>new Promise(r=>c.toBlob(r,t,q));
const mb=n=>(n/1048576).toFixed(n<1048576*10?2:1)+' MB';
async function exportImg(){
  const p=plan();if(!p)return;
  const fmt=$('#fmt').value,type='image/'+fmt,lossy=fmt!=='png',q=$('#q').value/100;
  const target=(parseFloat($('#tgt').value)||0)*1048576;
  let s=p.s,blob=null,last=null,tries=0,shrunk=p.capped,unsupported=false;
  const btn=$('#exp');btn.disabled=true;btn.textContent='Working…';
  await new Promise(r=>setTimeout(r,30));
  try{
    while(tries<14&&!blob){
      const c=render(p,s);
      const b=c?await enc(c,type,lossy?q:undefined):null;
      if(!b){s*=0.7;tries++;shrunk=true;continue}
      last=b;
      if(b.type!==type)unsupported=true;
      if(!target||b.size<=target){blob=b;break}
      if(lossy&&!unsupported){
        let lo=0.15,hi=q,best=null;
        for(let i=0;i<6;i++){const m=(lo+hi)/2,t=await enc(c,type,m);if(t&&t.size<=target){best=t;lo=m}else hi=m}
        if(best){blob=best;break}
      }
      s*=0.85;tries++;shrunk=true;
    }
  }finally{btn.textContent='Export';update()}
  if(!blob)blob=last;
  if(!blob){toast('This browser can’t build an image that large. Try fewer or smaller images.');return}
  const w=Math.max(1,Math.round(p.b.w*s)),h=Math.max(1,Math.round(p.b.h*s));
  const ext=blob.type==='image/jpeg'?'jpg':blob.type==='image/webp'?'webp':'png';
  let msg=`${w.toLocaleString()} × ${h.toLocaleString()} px, ${mb(blob.size)}`;
  if(unsupported)msg='This browser can’t save '+fmt.toUpperCase()+', so it made a PNG. '+msg;
  if(target&&blob.size>target)msg+=' (couldn’t reach the size target)';
  else if(shrunk)msg+=' (reduced to fit)';
  toast(msg);
  try{
    const dl=await claude?.use?.('downloads');
    if(dl){await dl.save({filename:'collage.'+ext,data:blob});return}
  }catch(err){if(err&&err.code==='declined')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='collage.'+ext;document.body.appendChild(a);a.click();a.remove();
}
$('#exp').onclick=exportImg;
update();
</script>
</body>
</html>
